<h3>Doação de Sangue</h3>
<form action="">
    nome: <input type="text" id="txtNome" placeholder="digite seu nome completo" required><br>
    email: <input type="email" id="txtEmail" required><br>
    senha: <input type="password" id="txtSenha" required><br>
    idade: <input type="number" id="txtIdade" min="18" max="65" required><br>
    peso: <input type="number" id="txtPeso" min="50" max="150" step="0.1" required><br>
    data: <input type="date" id="data" required> <br>
    hora: <input type="time" id="hora" required> <br>
    tipo sanguineo:<br>
    <input type="radio" name="tipo" id="opAp">A+
    <input type="radio" name="tipo" id="opBp">B+
    <input type="radio" name="tipo" id="opOp">O+<br>
    Condições: <br>
    <input type="checkbox" id="op6meses">Doou sangue nos ultimos 6 meses? <br>
    <input type="checkbox" id="opGravida">Esta gravido? <br>
    <input type="checkbox" id="opAlcool">Ingeriu alcool nas ultimas 12h? <br>
    <input type="checkbox" id="opTatoo">Fez tatuagem nos ultimos 3 meses <br>
    Unidade: <br>
    <select id="unidade">
        <option value="">Ipiranga</option>
        <option value="">Mooca</option>
        <option value="">Vila Mariana</option>
    </select> <br>
    mensagem: <textarea id="msg" rows="5" cols="30"></textarea><br>
    telefone: <input type="text" id="telefone" pattern="\([0-9]{2,3}\)\s[0-9]{4,5}-[0-9]{4}" required>
    <button>Enviar</button>
</form>
